name: Deploy Worker

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Build & Deploy Worker
        env:
          APPLE_BUNDLE_ID: ${{ secrets.APPLE_BUNDLE_ID }}
          APPLE_ENCRYPTION_KEY: ${{ secrets.APPLE_ENCRYPTION_KEY }}
          APPLE_ENCRYPTION_KEY_ID: ${{ secrets.APPLE_ENCRYPTION_KEY_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          secrets: |
            APPLE_BUNDLE_ID
            APPLE_ENCRYPTION_KEY
            APPLE_ENCRYPTION_KEY_ID
            APPLE_TEAM_ID
          wranglerVersion: "4"
